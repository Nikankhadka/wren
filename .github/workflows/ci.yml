name: CI

# The development gate (T-029): lint/typecheck/test/eval on every PR and every
# push to an integration branch. Kept as a separate workflow from deploy.yml
# (the production verification) - deploy.yml watches this workflow via
# workflow_run and only fires once this one is green on `staging`, so a broken
# build can never be declared deployed.
#
# B-4 corrected the branch list: this repo has `development` (integration) and
# `staging` (production), and no `main` at all, so the original `[main]` filter
# meant pushes were never gated and deploy.yml never fired once.

on:
  push:
    branches: [staging, development]
  pull_request:

# One in-flight run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI database + migration-runner inputs. WREN_APP_DB_PASSWORD must satisfy
  # app/core/migrate.py's _SAFE_VALUE_RE (8+ chars, no quotes/backslash/$).
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wren
  WREN_APP_DB_PASSWORD: ci_wren_app_pw
  SUPABASE_JWT_SECRET: ci-only-hs256-secret-not-used-in-prod-000000000000000000000000000000

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same patch frontend/Dockerfile builds on, so CI cannot
      # test one runtime and ship another. A floating "24" would drift from the
      # image between runs, which is the thing B-4's exact-pin rule exists to
      # stop. Node 24 (Krypton) is the Active LTS line, supported to 2028-04-30.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Token guard
        run: npm run check:tokens
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wren
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wren"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Pinned to a patch, not a major: astral-sh/setup-uv stopped publishing
        # moving major tags after v7, so `@v10` does not resolve at all.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .

      - name: Import boundary (F-2)
        # The deterministic hard rule (I1), machine-checked: pricing never
        # reaches a model, services never ask one for words, and the provider
        # seam stays a leaf. Contracts live in backend/pyproject.toml.
        run: uv run lint-imports
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy

      # B-4: the suite runs inside the shipping image's `test` stage, not
      # against the runner's uv environment. The stage installs `dev` but not
      # `local-ml`, exactly like the image that deploys - so a test that has
      # quietly come to depend on torch/sentence-transformers fails here rather
      # than at deploy time. Lint/typecheck stay on the runner above, where the
      # dependency split is irrelevant and the uv cache is worth having.
      #
      # --network host puts the container on the runner's network namespace, so
      # the `db` service's published 5432 is reachable at localhost, which is
      # what DATABASE_URL already says. conftest.py creates wren_test and runs
      # the migrations itself.
      - name: Build the test image
        run: docker build --target test -t wren-backend-test .
      - name: Tests
        run: |
          docker run --rm --network host \
            -e DATABASE_URL \
            -e WREN_APP_DB_PASSWORD \
            -e SUPABASE_JWT_SECRET \
            wren-backend-test

  api-types:
    # R-2: src/lib/api-types.ts is generated from the backend's OpenAPI
    # schema (frontend/scripts/gen-api-types.mjs) - the only place both
    # toolchains meet is CI, since the frontend dev container has no uv and
    # the backend one has no node_modules. `--check` fails the job without
    # writing, catching the exact drift class this ticket exists to prevent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync backend deps
        # local-ml (torch/sentence-transformers) is not needed just to import
        # the app and dump its OpenAPI schema.
        run: uv sync --frozen --no-group local-ml
        working-directory: backend
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Check api-types.ts is current
        run: npm run gen:types -- --check
        working-directory: frontend

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend, validate only)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  eval-gate:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wren
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wren"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # LLM-dependent evals run only when this secret is present; otherwise
      # run_gate runs the deterministic security/retrieval gates alone.
      # Provider bindings default to the free-first stack (openai_compat +
      # local embedder/reranker) so no cloud key is required for the
      # deterministic gate. Pinned model keeps LLM-eval numbers comparable.
      LLM_PROVIDER: openai_compat
      LLM_BASE_URL: https://openrouter.ai/api/v1
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: google/gemma-4-26b-a4b-it:free
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        # Pinned to a patch, not a major: astral-sh/setup-uv stopped publishing
        # moving major tags after v7, so `@v10` does not resolve at all.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      # Cache the HuggingFace models the local embedder/reranker download, so
      # the deterministic gate doesn't re-fetch ~180MB every run.
      - name: Cache HF models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-bge-small-minilm-v1
      - name: Migrate CI database
        run: uv run python -m app.shared.migrate
      - name: Seed tenants (retrieval + leakage)
        run: |
          uv run python -m seeds.seed_tenant1_phoneshop
          uv run python -m seeds.seed_leakage_pair
      - name: Run eval gate
        run: |
          if [ -n "${LLM_API_KEY}" ]; then
            uv run python -m evals.run_gate
          else
            echo "LLM_API_KEY not set - running deterministic gate only"
            uv run python -m evals.run_gate --skip-llm
          fi

  e2e:
    # R-5: the Playwright suite runs here, not only on a developer's machine.
    # The whole compose stack has to come up first, which makes this the most
    # expensive job in the workflow - so it waits on the two cheap jobs that
    # cover the same code it exercises. A frontend lint/typecheck/unit failure
    # or a backend test failure now reports in minutes instead of behind a full
    # stack build. `api-types` and `infra` touch nothing the browser drives, so
    # they stay parallel.
    #
    # No env setup step, on purpose: scripts/dev.sh (behind `make demo`) is
    # self-bootstrapping. It copies the committed .env.example to backend/.env,
    # generates WREN_APP_DB_PASSWORD and SUPABASE_JWT_SECRET, writes the root
    # .env that compose interpolates GOTRUE_JWT_SECRET from, and mints
    # frontend/.env.local with an anon key derived from that same secret. The
    # workflow-level DATABASE_URL/WREN_APP_DB_PASSWORD above are inert here -
    # every value the containers read comes from backend/.env and the compose
    # `environment:` blocks, which point at db:5432 inside the network.
    #
    # No LLM credentials either: the onboarding specs stub the model-backed
    # endpoints at the network layer with page.route, so no provider is called.
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install container dependencies
        # The e2e image installs nothing at boot - unlike the backend and
        # frontend dev images, whose entrypoints self-heal - so on a fresh
        # runner its node_modules volume is empty and `playwright test` would
        # not resolve. `make install` is where that install already lives, and
        # it warms the frontend volume in the same pass, so `next dev` answers
        # inside dev.sh's readiness window instead of running `npm ci` in it.
        run: make install
      - name: Start and seed the stack
        # dev.sh --seed: infra, migrations, demo world, then backend+frontend.
        # `make test-e2e` requires exactly this state.
        run: make demo
      - name: Wait for the stack
        # dev.sh polls both ports already but only warns when they stay quiet,
        # which would hand Playwright a dead stack and 105 timeouts instead of
        # one legible failure. Same bounded poll, hard failure, plus the logs
        # needed to read it.
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health >/dev/null 2>&1 \
              && curl -fsS http://localhost:3000 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "backend :8000 or frontend :3000 never answered"
          docker compose logs --tail 200 backend frontend
          exit 1
      - name: Playwright suite
        run: make test-e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # The html reporter's default output folder: playwright.config.ts
          # names no outputFolder, and the runner bind-mounts ./frontend, so the
          # report lands on the runner's filesystem. Traces (on-first-retry) and
          # failure screenshots are attached inside it.
          path: frontend/playwright-report/
          retention-days: 7
