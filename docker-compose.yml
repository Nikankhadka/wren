services:
  # Dev backend (F-3): the FastAPI app in a container, hot-reloading off the
  # ./backend bind mount. Deps live in the wren-backend-venv volume (installed
  # by `make install` or lazily at boot - see Dockerfile.dev), the HF model
  # cache in wren-hf-cache so embedder/reranker downloads survive restarts.
  #
  # env_file is optional so a fresh checkout can still `docker compose up -d
  # db`; scripts/dev.sh creates it before anything needs it. The environment
  # block deliberately overrides .env values with compose-network addresses:
  # inside this network the database is db:5432 (not localhost), and GoTrue
  # sits behind the auth-proxy shim (not :54321). pydantic-settings prefers
  # real env vars over .env, so these win exactly where they must.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wren
      SUPABASE_URL: http://auth-proxy
      # Only the deterministic E2E fixture may use the private Compose network.
      # Production leaves this empty, so the public URL SSRF guard is unchanged.
      URL_FETCH_ALLOWLIST: frontend:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - wren-backend-venv:/app/.venv
      - wren-hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      auth-proxy:
        condition: service_started

  # Dev frontend (F-3): next dev hot-reloading off the ./frontend bind mount,
  # deps in the wren-node-modules volume. Browser-facing URLs stay on
  # localhost (published ports) because that is what the user's browser
  # resolves; server-side fetches inside this container use API_INTERNAL_URL /
  # SUPABASE_INTERNAL_URL instead (localhost would be the frontend container
  # itself here) - API_INTERNAL_URL for the RSC tenant lookup (src/lib/tenant.ts),
  # SUPABASE_INTERNAL_URL for src/proxy.ts's server-side session refresh.
  # NEXT_PUBLIC_* values are read at dev-server start and inlined into client
  # bundles; the two INTERNAL_URL vars have no NEXT_ prefix, so neither reaches
  # browser code.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      API_INTERNAL_URL: http://backend:8000
      SUPABASE_INTERNAL_URL: http://auth-proxy
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - wren-node-modules:/app/node_modules
      - wren-next-cache:/app/.next
    depends_on:
      - backend

  # Playwright runner (profile e2e, `make test-e2e`): drives the stack that is
  # already up. The frontend inlines absolute API/auth origins on localhost
  # into the browser bundle, and in here localhost is this container - so the
  # entry command mirrors the host's port layout onto its own loopback, and
  # the stack becomes indistinguishable from running on the host. (Before D22
  # this also carried the *.localhost tenant subdomains, which Chromium pins
  # to 127.0.0.1 regardless of /etc/hosts; tenants are paths now, but the
  # inlined origins still need the mirrors.) Needs its own node_modules volume:
  # the Playwright image is Ubuntu while the dev frontend image is Debian
  # slim, and sharing one install across the two buys nothing.
  e2e:
    build:
      context: ./docker
      dockerfile: Dockerfile.e2e
    profiles: ["e2e"]
    working_dir: /app
    environment:
      # The loopback mirrors below stand in for the dev server, so the
      # playwright webServer block must never try to spawn its own.
      E2E_REUSE_SERVER: "1"
      # The paste-a-link specs hand this URL to the backend, which fetches it
      # from inside the compose network (localhost would be the backend).
      E2E_SITE_URL: http://frontend:3000/fixtures/example-business.html
      # Forwarded, not hardcoded: playwright.config.ts reads process.env.CI for
      # forbidOnly and retries, and `docker compose run` passes nothing from the
      # host unless it is declared here. GitHub Actions sets CI=true, so the
      # suite gets forbidOnly and 2 retries there; locally CI is unset and the
      # empty string is falsy in JS, so a developer's run keeps retries: 0 and
      # can still use test.only.
      CI: ${CI:-}
    ports:
      - "9323:9323"   # html report / ui mode while the container runs
    volumes:
      - ./frontend:/app
      - wren-e2e-node-modules:/app/node_modules

  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wren
    ports:
      - "5432:5432"
    volumes:
      - wren-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wren"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local GoTrue (Supabase Auth) for demo-ready login/signup. See
  # docs/DEMO.md and the demo plan: compose-native GoTrue runs its own
  # migrations into the `auth` schema of the existing wren database as the
  # postgres superuser, so backend DATABASE_URL, the migrate runner, the
  # wren_app/wren_resolver roles, and the persistent seeded dev DB are all
  # untouched. `docker compose up -d db` alone still works exactly as before -
  # these services are purely additive.
  #
  # The JWT secret is interpolated from the caller's environment
  # (${SUPABASE_JWT_SECRET:?...}) so the same secret in backend/.env signs
  # both GoTrue tokens and backend verification - run via scripts/dev.sh,
  # which exports it. A bare `docker compose up auth` without that var fails
  # fast (the :? is intentional).
  auth:
    image: supabase/auth:v2.192.0
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # GoTrue owns the auth schema; it connects as the postgres superuser
      # (the only role that can create its schema + run its migrations) into
      # the same wren database the app uses. Schema isolation is clean: wren's
      # migrate runner and RLS live entirely in public; wren_app/wren_resolver
      # get no grants on auth and never reference it.
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth so GoTrue's unqualified `users`/`sessions`/etc. queries
      # resolve to the auth schema, not wren's public.users (which has no aud
      # column). Set via the libpq `options` param (pgx honors it). The
      # supabase self-hosting stack achieves the same with a dedicated
      # supabase_auth_admin role whose search_path is auth; connecting as
      # postgres (so GoTrue can create its schema + run migrations) needs this
      # explicit search_path instead.
      GOTRUE_DB_DATABASE_URL: "postgres://postgres:postgres@db:5432/wren?options=-c%20search_path%3Dauth"
      GOTRUE_DB_NAMESPACE: auth
      # Single-sourced from backend/.env via scripts/dev.sh so GoTrue signing
      # and backend verify_token always agree. Non-fatal default (not :?) so
      # `docker compose up -d db` keeps working on a fresh checkout with no env
      # (compose parses the whole file even when only db is started). Running
      # `docker compose up auth` bare, without the secret, fails fast at the
      # GoTrue layer instead (it refuses to start on an empty JWT secret) - the
      # documented path is scripts/dev.sh, which exports the real value.
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      # GoTrue's own externally-reachable URL (used to build redirect/confirmation
      # links and as the JWT issuer). Note: no GOTRUE_ prefix on this one -
      # supabase's self-hosting compose sets it as bare API_EXTERNAL_URL.
      # Reached through the auth-proxy on 54321.
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      # Autoconfirm makes seeded logins (password grant, seed_demo.py) work
      # with no SMTP. Login-in-chat OTP is unaffected by this flag either way -
      # GoTrue always mails an OTP token, autoconfirm only skips the separate
      # signup-confirmation email.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      # One origin since D22 (tenants are paths, not subdomains). This used
      # to be a hand-maintained list with every dev tenant named in it.
      GOTRUE_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      # Login-in-chat OTP mail (auth migration): GoTrue is the code issuer now,
      # so it needs somewhere to send the mail. Mailpit speaks neither
      # STARTTLS nor AUTH and refuses both, so no user/pass here (mirrors the
      # old EMAIL_SMTP_* precedent).
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: login@agencx.local
      GOTRUE_SMTP_SENDER_NAME: Agencx
      # Default is 24h; 600s matches the UX the old backend-issued code had.
      GOTRUE_MAILER_OTP_EXP: "600"
      # Dev-only: the E2E suite logs in dozens of times per run, serially,
      # mostly as the same two demo owners - GoTrue's real defaults (1
      # mail/user/minute, 30 mails/hour project-wide) would fail the suite
      # outright. 1s still wasn't short enough - measured: Playwright cycles
      # through some spec files' setup faster than that, so two logins as the
      # same demo owner landed inside the same window and the second got
      # `over_email_send_rate_limit`. Hosted keeps the real limits; this
      # override never ships.
      GOTRUE_SMTP_MAX_FREQUENCY: "1ms"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100000"
      # GoTrue's own default magic-link template has no six-digit code in it
      # at all - only a magiclink URL (`{{ .ConfirmationURL }}`, built from
      # `{{ .TokenHash }}`) - confirmed by reading a real message out of
      # Mailpit while building this. Login-in-chat's UI (CodeInput, "type six
      # digits") needs the numeric `{{ .Token }}` GoTrue generates internally
      # but never surfaces without a template that asks for it explicitly.
      # The hosted deploy needs the equivalent edit in the Supabase dashboard
      # (Auth > Email Templates) - see deploy.md.
      # GoTrue fetches this over HTTP(S) at send time - a local file:// path
      # is not a supported scheme (confirmed: it errors and silently falls
      # back to the built-in template) - so it is served through the
      # auth-proxy nginx alongside GoTrue itself. See auth-proxy.conf.
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://auth-proxy/gotrue-templates/magic_link.html
      # GoTrue renders the "Confirm signup" template, not Magic Link, for any
      # address it hasn't seen before - signInWithOtp auto-creates the user,
      # so every real tenant owner hits this path on their first login, not
      # Magic Link. Same link-only-default problem, same fix, same file: there
      # is nothing signup-specific needed in the body.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://auth-proxy/gotrue-templates/magic_link.html
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port: the frontend reaches GoTrue through the auth-proxy shim on
    # 54321, which strips the /auth/v1 prefix supabase-js hardcodes (hosted
    # Supabase's Kong gateway does this in production).

  # Nginx shim: supabase-js hardcodes /auth/v1 as the path prefix; GoTrue
  # serves routes at / (hosted Supabase strips the prefix in Kong). Config in
  # docker/auth-proxy.conf. Port 54321 matches the supabase convention and the
  # URL already sitting in frontend/.env.local.
  auth-proxy:
    image: nginx:1.31.2-alpine
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "54321:80"
    volumes:
      - ./docker/auth-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/gotrue-templates:/usr/share/nginx/html/gotrue-templates:ro

  # Local inbox for the login-in-chat OTP (auth migration). GoTrue is the code
  # issuer now, and its SMTP settings on the `auth` service point here - so
  # this is no longer opt-in (`make mail`'s old `profiles: ["mail"]` gate is
  # gone): dev login does not work without it. Read the mail at
  # http://localhost:8025. `make mail` still works as a bare alias for
  # bringing this service up on its own. Nothing depends on it for startup
  # ordering beyond `auth` itself, so it needs no healthcheck; messages live in
  # memory and vanish on restart, which is what a throwaway dev inbox should
  # do.
  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  # Local Postgres web UI (pgweb) for browsing tables and running queries
  # against the wren database. Plain SQL over lib/pq, so pgvector columns
  # render as their text form (`[0.1,0.2,...]`) - fine for inspection.
  # Gated behind the `dbui` profile like mailpit's `mail`: opt-in via
  # `make dbui`, never started by dev.sh/up-infra.sh.
  pgweb:
    image: sosedoff/pgweb:0.17.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/wren?sslmode=disable
    ports:
      - "8081:8081"   # web UI

volumes:
  wren-pgdata:
  wren-backend-venv:
  wren-node-modules:
  wren-next-cache:
  wren-e2e-node-modules:
  wren-hf-cache:
