[project]
name = "wren-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "asyncpg==0.31.0",
    "pydantic-settings==2.14.2",
    "pyjwt[crypto]==2.13.0",
    "openai==2.45.0",
    "python-multipart==0.0.32",
    "pypdf==6.14.2",
    "pgvector==0.5.0",
    "langgraph==1.2.9",
    "httpx==0.28.1",
    "selectolax==0.4.11",
]

[dependency-groups]
# T-035: sentence-transformers pulls in torch (~100MB+), fine for dev but far
# too heavy for the 0.25vCPU/0.5GB Fargate task. It lives in its own group,
# installed by default locally and in CI (default-groups below) so the local
# EMBEDDER/RERANKER dev stack keeps working unchanged - only the production
# image opts out (backend/Dockerfile: --no-group local-ml), which is why the
# ECS task definition binds EMBEDDER/RERANKER to hosted providers.
local-ml = [
    "sentence-transformers==5.6.0",
    # Declared directly (not left transitive) so the [tool.uv.sources] pin
    # below applies - uv routes sources only for direct dependencies.
    "torch==2.13.0",
]
dev = [
    "import-linter==2.13",
    "mypy==2.2.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.4.0",
    "ruff==0.15.21",
    "asyncpg-stubs==0.31.3",
    "hypothesis==6.156.6",
]

[tool.uv]
default-groups = ["dev", "local-ml"]

# F-3: torch from the CPU wheel index. PyPI's linux torch wheels declare the
# full CUDA stack (nvidia-* + triton, ~5GB) as dependencies - pointless weight
# for a dev container and for CI's ubuntu runner, and the mac wheels were
# already CPU-only. The cpu index ships every platform torch supports without
# the CUDA baggage; sentence-transformers behavior is identical on CPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# A CI run hung indefinitely at the "Tests" step (no local reproduction,
# twice reproducible in CI, no diagnostic log retained since GitHub drops
# logs for a forcibly-cancelled job) - the slowest real test in the suite
# patches its own timeout to 0 rather than waiting it out (see
# test_knowledge_api.py's use of _DRAFT_TIMEOUT_SECONDS), so 60s per test is
# generous headroom, not a tight budget. This turns an unbounded stall into a
# fast, precisely located failure with a real traceback on the next run.
timeout = 60
# Session-scoped async fixtures must not await after yield (they run on the first
# requesting test's function-scoped loop); see tests/conftest.py.
asyncio_default_fixture_loop_scope = "function"
markers = ["db: tests that require a live Postgres (docker compose up -d db)"]
# Run the suite at the level production runs at (Settings.log_level). Without
# this, logging short-circuits every logger.info() before makeRecord, so a bad
# extra={} key - "name", "module", "args" and the rest of the reserved
# LogRecord set raise KeyError - is inert in tests and fatal in the deploy.
# That is exactly how a KeyError in the agent's tool loop shipped.
log_level = "INFO"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "seeds", "evals"]


# ── F-2: the deterministic boundary, machine-checked ────────────────────────
#
# The hard rule (I1) is that no language model can reach the money path. Every
# other statement of it - engine.py's docstring, conventions.md, review - is a
# promise; this is the part that fails a build.
#
# Scope note, because the ADR that asked for this described a different
# contract: it said "forbid importing llm/provider.py outside agents/ and
# llm/". Applied literally that fails on a dozen files today, and correctly so
# - `features/chat`, `features/knowledge` and `features/onboarding` import
# `LLMProvider` as a FastAPI dependency-injection annotation, which is how a
# route receives the provider at all. Forbidding that would not protect
# determinism, it would just make the app impossible to wire. The contracts
# below enforce the boundary the code is actually built around.
[tool.importlinter]
root_packages = ["app"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Pricing never reaches a model"
type = "forbidden"
source_modules = ["app.pricing"]
forbidden_modules = ["app.llm", "app.agents", "app.onboarding", "app.retrieval"]
# No exceptions, ever. Agents select rule codes and quantities; this package
# computes every cent from the database. A single import here would make the
# money path something a model could influence.

[[tool.importlinter.contracts]]
name = "The deterministic services layer never asks a model"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.llm.provider", "app.agents"]
# services/ is the cross-feature layer of plain functions (context packages,
# knowledge versioning, the retrieval seam). It reads and writes; it never asks
# a model for words. (Auth/session issuance moved to GoTrue OTP + @supabase/ssr
# cookies - the login-code/email/identity modules that used to live here are
# gone.)
#
# `app.llm.embedder` is deliberately NOT forbidden, and `services/retrieval.py`
# uses it. An embedder turns text into a vector - deterministic, no prose, no
# figures - and O-4's whole-corpus seam cannot do hybrid retrieval without one.
# The rule that matters is that nothing here generates content; forbidding the
# whole `app.llm` package would have banned arithmetic along with authorship.

[[tool.importlinter.contracts]]
name = "The provider seam is a leaf"
type = "forbidden"
source_modules = ["app.llm"]
forbidden_modules = ["app.features", "app.agents", "app.onboarding", "app.pricing"]
# The LLM layer is swapped by config (Google, Groq, OpenRouter, Azure). If it
# reached upward into features or agents, swapping a provider would mean
# reading the whole application to know what else moved.
